<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>W3BP0NG - Next-Generation Pong</title>
    <meta name="description" content="Experience Pong like never before with liquid glass synthwave aesthetics, multiple game modes, and cutting-edge web technology." />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Preload critical resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />

    <!-- Optional: Delay SW registration; only if /sw.js exists -->
    <script>
      (function () {
        window.addEventListener('load', function () {
          setTimeout(function () {
            if ('serviceWorker' in navigator) {
              fetch('/sw.js', { method: 'HEAD' })
                .then(function (r) {
                  if (r.ok) {
                    navigator.serviceWorker
                      .register('/sw.js')
                      .then(function (reg) {
                        console.log('[SW] registered:', reg.scope);
                      })
                      .catch(function (err) {
                        console.warn('[SW] registration failed:', err);
                      });
                  }
                })
                .catch(function () {
                  // no sw.js present; skip
                });
            }
          }, 1500);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <noscript>
      <div style="font-family: 'Orbitron', monospace; text-align: center; padding: 2rem; color: #a855f7;">
        <h1>W3BP0NG</h1>
        <p>JavaScript is required to play this game.</p>
        <p>Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
  </body>
</html>
