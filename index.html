<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>W3BP0NG - Next-Generation Pong</title>
    <meta name="description" content="Experience Pong like never before with liquid glass synthwave aesthetics, multiple game modes, and cutting-edge web technology." />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Preload critical resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />

    <!-- ✅ Safe UTF-8 clean version of service worker registration -->
    <script>
      // ✅ Safe UTF-8 clean version of service worker registration
      window.addEventListener("load", () => {
        setTimeout(() => {
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker
              .register("/service-worker.js")
              .then(() => {
                console.log("✅ Service Worker registered:", window.location.href);
              })
              .catch((error) => {
                console.warn("❌ Service Worker registration failed:", error);
              });
          } else {
            console.log("Service workers not supported in this browser.");
          }
        }, 500); // small delay prevents hydration race conditions
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <noscript>
      <div style="font-family: 'Orbitron', monospace; text-align: center; padding: 2rem; color: #a855f7;">
        <h1>W3BP0NG</h1>
        <p>JavaScript is required to play this game.</p>
        <p>Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
  </body>
</html>
